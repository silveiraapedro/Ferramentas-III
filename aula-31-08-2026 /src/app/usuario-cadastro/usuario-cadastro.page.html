<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>usuario-cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
  <ion-list>
    <ion-item>
      <ion-input label="Email" labelPlacement="stacked" formControlName="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Nome" labelPlacement="stacked" formControlName="first_name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Sobrenome" labelPlacement="stacked" formControlName="last_name"></ion-input>
    </ion-item>   
    <br>
    
    <ion-button (click)="cadastrar()">Cadastrar</ion-button>
    <ion-button routerLink="/home" color="danger">Cancelar</ion-button>
  </ion-list>
  </form>
</ion-content>
