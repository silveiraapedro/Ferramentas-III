<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Componentes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <ion-input label="Nome" [(ngModel)]="pessoa.nome"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Endereco" [(ngModel)]="pessoa.endereco"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Salario" type="number" [(ngModel)]="pessoa.salario"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button (click)="adicionar()" shape="round">
    Adicionar 
  </ion-button>

  <ion-button>
    <ion-icon name="heart"></ion-icon>
  </ion-button>

  @if(pessoas.length > 0){
  <ion-grid>
  <ion-row>
    <ion-col><strong>Nome</strong></ion-col>
    <ion-col><strong>Endereco</strong></ion-col>
    <ion-col><strong>Salario</strong></ion-col>
    <ion-col></ion-col>
  </ion-row>
  @for(item of pessoas; track $index)
  {
  <ion-row>
    <ion-col>{{item.nome}}</ion-col>
    <ion-col>{{item.endereco}}</ion-col>
    <ion-col>{{item.salario}}</ion-col>
    <ion-col><ion-button (click)="excluir($index)"><ion-icon name="trash"></ion-icon></ion-button></ion-col>
  </ion-row>
  }
</ion-grid>
}

  
</ion-content>
