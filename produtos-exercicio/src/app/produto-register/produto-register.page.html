<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>produto-register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
    <ion-item>
      <ion-input label="Nome" labelPlacement="stacked"  formControlName="nome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Categoria" labelPlacement="stacked"  formControlName="categoria"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Preço" labelPlacement="stacked"  formControlName="preco"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Fornecedor" labelPlacement="stacked"  formControlName="fornecedor"></ion-input>
    </ion-item>

    <ion-button (click)="cadastrar()">Cadastrar</ion-button>
    <ion-button routerLink="/produto-list" color="danger">Cancelar</ion-button>
    </ion-list>
  </form>
</ion-content>
